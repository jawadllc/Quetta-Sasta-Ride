name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: App tayyar karein
        run: |
          mkdir -p www
          cp index.html www/index.html
          npm init -y
          npm install @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6
          cat > capacitor.config.json <<'EOF'
          {
            "appId": "ai.quettasastarides.app",
            "appName": "Quetta Sasta Rides",
            "webDir": "www"
          }
          EOF
          npx cap add android
          npx cap sync android

      - name: Permissions jodein
        run: |
          M=android/app/src/main/AndroidManifest.xml
          sed -i 's#</manifest>#  <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION"/>\n  <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION"/>\n  <uses-permission android:name="android.permission.POST_NOTIFICATIONS"/>\n</manifest>#' $M

      - name: APK banayein
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: APK upload karein
        uses: actions/upload-artifact@v4
        with:
          name: QuettaSastaRides-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk